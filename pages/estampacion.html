<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estampación — Marlene Pauletich San Juan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; width: 100%; }
  .page { position: relative; width: 100%; max-width: 1920px; margin: 0 auto; container-type: inline-size; }
  .imgwrap { position: relative; line-height: 0; }
  .imgwrap img { display: block; width: 100%; height: auto; }
  .stack img { display: block; width: 100%; height: auto; margin: 0; }
  a.hotspot { position: absolute; display: block; text-indent: -9999px; outline: none; -webkit-tap-highlight-color: transparent; }
  a.hotspot:focus-visible { box-shadow: 0 0 0 3px rgba(255,255,255,0.85); border-radius: 999px; }
  /* "Volver atrás" pill — baked into el hero de este proyecto */
  .hotspot--back {
    left: 0.8%;
    top: 2.4%;
    width: 10.2%;
    height: 3%;
    border-radius: 999px;
  }
  .counter {
    position: absolute; top: 12.8%; right: clamp(20px, 4vw, 48px);
    font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 6vw, 4rem);
    color: #fff; mix-blend-mode: difference; display: flex; align-items: baseline; gap: 14px;
    pointer-events: none;
  }
  .counter .tot { font-size: .5em; opacity: .7; }
</style>
</head>
<body><script>function __siteNav(r){try{parent.postMessage({__siteNav:r},"*");}catch(e){}return false;}function __siteBack(){try{parent.postMessage({__siteBack:true},"*");}catch(e){}return false;}</script>
  <div class="page">
    <div class="imgwrap">
      <img src="estampacion_hero.jpg" alt="Estampación — Proyecto 09 — Diseño de estampados" draggable="false">
      <a class="hotspot hotspot--back" href="#" onclick="return __siteBack()" aria-label="Volver atrás">Volver atrás</a>
      <div class="counter"><span>09</span><span class="tot">/ 9</span></div>
    </div>
    <div class="stack">
      <img src="estampacion_title.jpg" alt="Proyecto 09 — Diseño de estampados. Estampación." draggable="false">
      <div style="position:relative;width:100%;aspect-ratio:5760/2087;background:#fff;overflow:hidden;">
        <video src="estampacion_video.mp4" muted autoplay loop playsinline preload="metadata" poster="estampacion_video_poster.jpg" style="position:absolute;left:21.6%;top:4%;width:56.6%;height:95.6%;object-fit:cover;display:block;"></video>
      </div>
      <img src="estampacion_intro_text.jpg" alt="Proyectos y procesos: estampas diseñadas durante la búsqueda de patrones para la colección final de máster" draggable="false">
      <img src="estampacion_pattern1.jpg" alt="Estampa textil y look sobre modelo" draggable="false">
      <img src="estampacion_swatches.jpg" alt="Estampas diseñadas manualmente con tintas, sublimada sobre textil y editada en Photoshop para la creación del rapport" draggable="false">
      <img src="estampacion_look1.jpg" alt="Look con estampa floral sobre modelo" draggable="false">
      <img src="estampacion_look2.jpg" alt="Look con estampa floral, detalle de botas" draggable="false">
      <img src="estampacion_look3.jpg" alt="Look con estampa verde sobre modelo" draggable="false">
    </div>
  </div>
</body>
</html>
